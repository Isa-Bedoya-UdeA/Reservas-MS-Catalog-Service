# ========================================
# ServiceMonitor for Prometheus
# ========================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalog-service-monitor
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: catalog-service
  endpoints:
    - port: "8082"
      path: /actuator/prometheus
      interval: 15s
